; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-wroom-devkitm-1]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<Hub/**>
lib_deps =
	arduino-libraries/LiquidCrystal @ ^1.0.7
monitor_speed = 115200

[env:esp32-c3-devkitm-1]
platform = espressif32
board = dfrobot_beetle_esp32c3
framework = arduino
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<Clip/**>
monitor_speed = 115200

; Photodiode box-sensor bench — standalone firmware that reads one ADC pin and
; streams raw values + rolling stats, with no project libs (see test_logs/README.md).
[env:bench-photodiode]
platform = espressif32
board = dfrobot_beetle_esp32c3
framework = arduino
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<BenchPhotodiode/**>
monitor_speed = 115200

; Reflective-IR box-sensor bench (open = no reflection = below threshold).
[env:bench-ir]
platform = espressif32
board = dfrobot_beetle_esp32c3
framework = arduino
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<BenchIR/**>
monitor_speed = 115200



